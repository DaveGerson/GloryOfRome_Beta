name: CI

on:
  push:
  pull_request:

# Read-only token: CI only checks out and runs checks.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running check. Runs on
# master are never cancelled, so every mainline commit keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The three legs are exactly `npm run verify`'s three stages
  # (package.json: verify = verify:static && verify:unit &&
  # verify:integration), run in parallel. CI and local verify therefore
  # cannot drift: add a check to a verify:* script and CI picks it up.
  #
  # Rough local timings: static ~40s, unit ~50s, integration ~15s. Serial
  # that is ~105s after install; in parallel the wall time is the slowest
  # leg, at the cost of two extra (cached) `npm ci` runs.
  #
  # The integration leg includes `npm run eval:ci` (vitest.eval-ci.config.ts):
  # the deterministic offline eval over the committed fixture corpus, with
  # the LLM judge forced off. The paid, judged `npm run eval` stays local.
  verify:
    name: verify:${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: [static, unit, integration]
    defaults:
      run:
        working-directory: roman_crisis_simulation/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roman_crisis_simulation/src/package-lock.json

      - run: npm ci

      - run: npm run verify:${{ matrix.leg }}
