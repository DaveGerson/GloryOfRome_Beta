name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roman_crisis_simulation/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roman_crisis_simulation/src/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Deterministic eval leg: GOR_EVAL_CORPUS points at the committed
      # fixture corpus, so eval/harness.ts's offline checks (schema
      # validity, capture completeness, seeded roll replay) actually
      # execute here. No GEMINI_API_KEY is set in this job, so the LLM
      # judge self-skips (eval/runEval.eval.ts). `npm run eval` is
      # intentionally NOT a full-eval CI gate: with a key present it makes
      # one real model call per corpus turn (see vitest.eval.config.ts) —
      # that paid, non-deterministic leg stays local-only.
      - run: npm run eval
        env:
          GOR_EVAL_CORPUS: eval/fixtures/ci-corpus.json

      - run: npm run test:journeys

      - run: npm run build
