name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roman_crisis_simulation/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roman_crisis_simulation/src/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:lint-baseline

      - run: npm test

      - run: npm run test:journeys

      - run: npm run build

      # `npm run eval` is intentionally NOT a CI gate: it makes one real
      # model call per corpus turn when an API key is present (see
      # vitest.eval.config.ts) — a paid, non-deterministic leg run locally.
