<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      LVX is a light skin and NOX declares `color-scheme:dark` for itself. With
      nothing declared here, a device in OS dark mode can auto-invert the whole
      marble skin - computed styles stay light while paint goes dark. Declaring
      both, with `html{color-scheme:light}` in the base stylesheet, leaves the
      day skin alone and lets nocturne.css keep its own override.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>Roman Crisis Simulation — The Glory of Rome</title>
    <!--
      Styling comes from the Glory of Rome design system (design/styles.css,
      imported by index.tsx): tokens for parchment/ink/imperial metals,
      component classes (gor-*), and the Nox Romae night skin
      (design/nocturne.css, lazy-loaded by the LVX/NOX switch).
    -->
    <!--
      A device that has never chosen between LVX and NOX follows the
      system's own appearance: a light system opens on marble day, a dark
      one - or one that does not say - on Nox Romae, the house lighting.
      An explicit choice in the configuration menu is stored as `gor-theme`
      and always wins (hooks/useSettings.ts resolves the same way, and
      follows the system as it changes until a choice is made). Nothing is
      written here: seeding `gor-theme` would pass the house default off as
      the player's own choice. To open every new device on NOX instead,
      treat a null `gor-theme` as 'nox' here and in useSettings. Until the
      night stylesheet arrives the ground is painted basalt, so the first
      frame is not a flash of daylight.
    -->
    <script>
      /* Storage and the system are read apart: blocked storage (private
         mode) means "never chose", and the system still decides - exactly
         as useSettings's storedLighting/systemPrefersLight resolve it. */
      var gorTheme = null;
      try { gorTheme = localStorage.getItem('gor-theme'); } catch (e) { /* private mode: no stored choice */ }
      var gorSystemLight = false;
      try { gorSystemLight = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch (e) { /* no media queries: the house night */ }
      if (gorTheme === 'nox' || (gorTheme !== 'lux' && !gorSystemLight)) document.documentElement.setAttribute('data-gor-dusk', '');
      /* Text size and motion (persistence/readingPrefs.ts), seeded before the
         first paint so a large-type reader never sees a frame of small type.
         The hook re-applies the same keys once React mounts. */
      try {
        var gorReading = localStorage.getItem('gloryOfRome:readingScale');
        if (gorReading === 'large' || gorReading === 'larger') document.documentElement.setAttribute('data-gor-reading', gorReading);
        if (localStorage.getItem('gloryOfRome:motion') === 'reduced') document.documentElement.setAttribute('data-gor-motion', 'reduced');
      } catch (e) { /* private mode: the defaults stand */ }
    </script>
    <style>
      html[data-gor-dusk], html[data-gor-dusk] body:has(#root:empty) { background: #130F0B; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
