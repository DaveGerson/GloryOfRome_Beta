<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      LVX is a light skin and NOX declares `color-scheme:dark` for itself. With
      nothing declared here, a device in OS dark mode can auto-invert the whole
      marble skin - computed styles stay light while paint goes dark. Declaring
      both, with `html{color-scheme:light}` in the base stylesheet, leaves the
      day skin alone and lets nocturne.css keep its own override.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>Roman Crisis Simulation — The Glory of Rome</title>
    <!--
      Styling comes from the Glory of Rome design system (design/styles.css,
      imported by index.tsx): tokens for parchment/ink/imperial metals,
      component classes (gor-*), and the Nox Romae night skin
      (design/nocturne.css, lazy-loaded by the LVX/NOX switch).
    -->
    <!--
      Rome after dark is the house lighting: a device that has never chosen
      between LVX and NOX opens on Nox Romae. This only seeds the same
      `gor-theme` preference the configuration menu writes (App.tsx reads it
      on mount), so an explicit LVX choice is never overridden; delete this
      block to make marble day the default again. Until the night stylesheet
      arrives the ground is painted basalt, so the first frame is not a
      flash of daylight.
    -->
    <script>
      try {
        if (localStorage.getItem('gor-theme') === null) localStorage.setItem('gor-theme', 'nox');
        if (localStorage.getItem('gor-theme') === 'nox') document.documentElement.setAttribute('data-gor-dusk', '');
      } catch (e) { /* private mode: the day skin stands */ }
    </script>
    <style>
      html[data-gor-dusk], html[data-gor-dusk] body:has(#root:empty) { background: #130F0B; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
